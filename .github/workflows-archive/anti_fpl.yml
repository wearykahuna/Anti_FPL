name: Anti-FPL

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        required: true
        default: 'scheduler'
        type: choice
        options:
          - full_refresh
          - scheduler
          - refresh_reference
          - refresh_picks
          - refresh_live
          - recalc_scores
          - recalc_gw
          - finalize_gw
          - backfill_player_scores
          - backfill_team_value
          - backfill_transfers
          - snapshot
          - score_new_team
          - create_mini_league
          # Read-only / dry-run-by-default. Both need --apply or --league to do
          # anything meaningful, and neither takes that from here, so from
          # Actions they are safe to run. purge_teams is deliberately NOT
          # listed: it is destructive and belongs on a local terminal where you
          # can read the dry-run output before committing to it.
          - audit_teams
          - repair_bank
      team_id:
        description: 'Team ID (only for score_new_team)'
        required: false
        type: string
      league_id:
        description: 'FPL league ID (for score_new_team bulk mode or create_mini_league)'
        required: false
        type: string
      invite_code:
        description: 'Supabase invite_code label (only for create_mini_league)'
        required: false
        type: string
      gw_from:
        description: 'GW start (only for recalc_gw)'
        required: false
        type: string
      gw_to:
        description: 'GW end (only for recalc_gw — leave blank for single GW)'
        required: false
        type: string

  schedule:
    # Each cron line has a comment with which task it maps to.
    # The "Determine task" step uses the cron string to dispatch.
    #
    # refresh_picks is no longer scheduled separately — scheduler.tick() now
    # calls it at the top of every tick below (self-gated, ~free once a GW's
    # picks are captured), so any deadline gets picked up automatically
    # regardless of which day it falls on, instead of guessing weekend-only
    # deadline windows and missing midweek/rearranged-fixture GWs.

    # NOTE: every cron below is deliberately OFF the top of the hour. GitHub
    # defers scheduled workflows under load and minute :00 is by far the most
    # contended slot — on a busy Saturday that deferral was costing 10-25 min
    # of live coverage every hour. The exact minute doesn't matter (the worker
    # loops internally for ~55 min); only that it isn't :00.
    # If you change a cron string here you MUST change the matching arm of the
    # `case` in the "Determine task" step below — an unmatched cron silently
    # falls through to TASK=scheduler.

    # ── refresh_reference: daily 03:07 UTC + 14:07 UTC (catch post-deadline GW transitions) ──
    - cron: '7 3 * * *'
    - cron: '7 14 * * *'

    # ── scheduler: tiered by day, based on actual PL kickoff-time distribution
    #    (2021-26 fixture data: Sat/Sun spread from 11h local; every other day
    #    is almost entirely 17h/19h/20h local evening kickoffs). worker.py loops
    #    internally within each hour (60s tick while live/settling, 300s idle,
    #    exits early when nothing is coming up) ──
    - cron: '9 11-23 * * 6,0'    # Sat/Sun: full hourly — real spread across the day
    - cron: '9 15-22 * * 1'      # Mon: evening-only — MNF has no early kickoffs
    - cron: '9 16-22 * * 2,3,4,5' # Tue-Fri: evening-only, +1h padded for BST/GMT drift

    # ── scheduler: overnight finalize sweep, every day ────────────────────
    #    Without this, a GW whose last fixture ends late leaves gw_scores rows
    #    flagged is_live until the next day's evening window — ~16h on a Sunday
    #    (23:00 maps to snapshot, and Mon's first scheduler is 15:09) and ~17h
    #    Tue-Fri. Cheap: --exit-when-idle returns after one tick when idle.
    - cron: '9 0-2 * * *'

    # ── snapshot: weekly Sunday 23:40 UTC ─────────────────────────────────
    - cron: '40 23 * * 0'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # The step below has its own 58-min cap, but the job had none — a hung
    # checkout or pip install could sit at the 6h default.
    timeout-minutes: 70
    # Serialise scheduled runs against each other so a deferred run can't
    # overlap the next one (two workers double-ticking race each other's
    # gw_scores upserts and update_rankings_for_gw writes). Keyed so a manual
    # dispatch is never queued behind a running scheduler.
    concurrency:
      group: anti-fpl-${{ github.event.schedule || github.event.inputs.task || github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine task
        id: t
        run: |
          # Manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ github.event.inputs.task }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Schedule trigger — dispatch by cron value
          CRON='${{ github.event.schedule }}'
          # These MUST stay in sync with the `schedule:` block above — an
          # unmatched cron falls through to scheduler, which would silently
          # turn the reference refresh or the snapshot into a scheduler run.
          case "$CRON" in
            "7 3 * * *"|"7 14 * * *")
              TASK=refresh_reference ;;
            "40 23 * * 0")
              TASK=snapshot ;;
            # Everything else = scheduler (which now folds refresh_picks in too)
            *)
              TASK=scheduler ;;
          esac
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "Mapped cron '$CRON' to task '$TASK'"

      - name: Run task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        working-directory: Backend
        timeout-minutes: 58
        run: |
          TASK="${{ steps.t.outputs.task }}"
          echo "Running task: $TASK"
          if [ "$TASK" = "full_refresh" ]; then
            python run_task.py refresh_reference
            python run_task.py refresh_picks
            python run_task.py recalc_scores
          elif [ "$TASK" = "score_new_team" ]; then
            if [ -n "${{ github.event.inputs.league_id }}" ]; then
              python run_task.py "$TASK" --league "${{ github.event.inputs.league_id }}"
            else
              python run_task.py "$TASK" --team "${{ github.event.inputs.team_id }}"
            fi
          elif [ "$TASK" = "create_mini_league" ]; then
            python run_task.py "$TASK" \
              --league "${{ github.event.inputs.league_id }}" \
              --invite-code "${{ github.event.inputs.invite_code }}"
          elif [ "$TASK" = "audit_teams" ]; then
            AUDIT_ARGS="--all-db"
            [ -n "${{ github.event.inputs.league_id }}" ] && AUDIT_ARGS="$AUDIT_ARGS --league ${{ github.event.inputs.league_id }}"
            [ -n "${{ github.event.inputs.invite_code }}" ] && AUDIT_ARGS="$AUDIT_ARGS --invite-code ${{ github.event.inputs.invite_code }}"
            python run_task.py "$TASK" $AUDIT_ARGS
          elif [ "$TASK" = "repair_bank" ]; then
            # No --apply here on purpose: from Actions this is always a dry run.
            GW_ARGS=""
            [ -n "${{ github.event.inputs.gw_from }}" ] && GW_ARGS="--gw-from ${{ github.event.inputs.gw_from }}"
            [ -n "${{ github.event.inputs.gw_to }}" ]   && GW_ARGS="$GW_ARGS --gw-to ${{ github.event.inputs.gw_to }}"
            python run_task.py "$TASK" $GW_ARGS
          elif [ "$TASK" = "recalc_gw" ] || [ "$TASK" = "finalize_gw" ] || [ "$TASK" = "backfill_player_scores" ]; then
            GW_ARGS=""
            [ -n "${{ github.event.inputs.gw_from }}" ] && GW_ARGS="--gw-from ${{ github.event.inputs.gw_from }}"
            [ -n "${{ github.event.inputs.gw_to }}" ]   && GW_ARGS="$GW_ARGS --gw-to ${{ github.event.inputs.gw_to }}"
            python run_task.py "$TASK" $GW_ARGS
          elif [ "$TASK" = "scheduler" ]; then
            # Adaptive loop: 60s ticks while live/settling/provisional/finalizing,
            # 300s while idle, exits early when nothing kicks off within ~70 min
            # (the next hourly cron covers it).
            python worker.py --max-minutes 55 --exit-when-idle
          else
            python run_task.py "$TASK"
          fi

      - name: Commit snapshot if any
        if: steps.t.outputs.task == 'snapshot'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet || git commit -m "snapshot: $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push