<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>antifpl · Overall League</title>
  <style>
    :root {
      --bg:#fff; --surface:#fff; --border:#e0e0e0;
      --text:#111; --muted:#888;
      --accent:#d62828; --good:#1a7f4b; --warn:#b86e00; --live:#d62828;
      --font:'Inter',system-ui,sans-serif;
      --mono:'JetBrains Mono','Fira Code',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:24px 16px 48px}

    header{max-width:900px;margin:0 auto 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .logo-wrap{background:#fff;display:inline-block;line-height:0}
    .logo-img{height:120px;width:auto;display:block}
    .meta{text-align:right;font-size:0.78rem;color:var(--muted);font-family:var(--mono);line-height:1.8}

    .live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(214,40,40,0.12);
                border:1px solid rgba(214,40,40,0.3);color:var(--live);font-size:0.7rem;font-weight:700;
                letter-spacing:0.1em;padding:3px 10px;border-radius:99px;margin-bottom:4px}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}

    .tabs{max-width:900px;margin:0 auto 24px;display:flex;border-bottom:1px solid var(--border);gap:0;flex-wrap:wrap}
    .tab{padding:10px 18px;font-size:0.82rem;font-weight:600;color:var(--muted);
         border-bottom:2px solid transparent;cursor:pointer;text-decoration:none;transition:all 0.2s}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--text);border-bottom-color:var(--accent)}

    .gw-bar{max-width:900px;margin:0 auto 20px;display:flex;justify-content:space-between;
            align-items:flex-start;gap:12px;flex-wrap:wrap}
    .gw-pills{display:flex;gap:12px;flex-wrap:wrap}
    .gw-pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;
             padding:8px 16px;font-size:0.78rem;color:var(--muted)}
    .gw-pill strong{color:var(--text);font-size:1rem;display:block}

    .table-wrap{max-width:900px;margin:0 auto;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:0.85rem}
    thead th{text-align:left;padding:10px 14px;font-size:0.68rem;font-weight:600;letter-spacing:0.08em;
             color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
    thead th.r{text-align:right}
    /* Narrower numeric columns (To Play .. Provisional Score): let the header
       label wrap onto two lines instead of forcing the column wide enough for
       "Provisional Score" on one line — that single header was the main thing
       pushing the table into needing a horizontal scrollbar. */
    th.tight,td.tight{padding-left:8px;padding-right:8px}
    th.tight{white-space:normal;line-height:1.15;vertical-align:bottom}
    thead th[data-key]{cursor:pointer;user-select:none}
    thead th[data-key]:hover{color:var(--text)}
    thead th[data-key].sorted{color:var(--accent)}
    tbody tr.team-row{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
    tbody tr.team-row:hover,tbody tr.team-row.expanded{background:var(--surface)}
    td{padding:12px 14px;vertical-align:middle;white-space:nowrap}
    td.r{text-align:right;font-family:var(--mono)}

    .pos{font-family:var(--mono);font-size:0.75rem;color:var(--muted);width:32px}
    .pos.top3{color:var(--good);font-weight:700}

    .team-name{font-weight:600;font-size:0.88rem}
    .manager-name{font-size:0.72rem;color:var(--muted);margin-top:2px}

    .chips-row{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
    .chip-pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;
               padding:1px 4px;font-size:0.55rem;font-weight:700;letter-spacing:0.05em;
               border-radius:3px;line-height:1.5;border:1px solid transparent}
    /* ── Chip colour system ───────────────────────────────────────────────
       One source of truth: WC purple / FH amber / BB cyan / TC red, matching
       the dashboards' --chip-* vars. Each has a pastel background and a
       darker "ink" for text, so the same pair is used by BOTH the chip pips
       in a team row and the "Chips active" pill breakdown. State is carried
       by fill, not hue: available = pastel, used = drained to grey, live =
       solid + pulsing. */
    .chip-wc{--chip-soft:#f0e8fd;--chip-ink:#6d28d9;--chip-solid:#7c3aed}
    .chip-fh{--chip-soft:#fdf1dd;--chip-ink:#955900;--chip-solid:#b86e00}
    .chip-bb{--chip-soft:#e0f3f8;--chip-ink:#06708f;--chip-solid:#0891b2}
    .chip-tc{--chip-soft:#fce8e8;--chip-ink:#b31f1f;--chip-solid:#d62828}

    .chip-avail{background:var(--chip-soft);color:var(--chip-ink);border-color:#e3e3e3;
                border-color:color-mix(in srgb, var(--chip-solid) 28%, transparent)}
    /* Spent chips drain to grey so what's gone reads at a glance. */
    .chip-used{background:#ececec;color:#aaa;border-color:#ddd}
    .chip-live{background:var(--chip-solid);color:#fff;border-color:var(--chip-solid);
               animation:chip-pulse 1.4s ease-in-out infinite}

    /* Same pastel pair, reused in the "Chips active" summary pill. */
    .chip-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;
              font-size:0.62rem;font-weight:700;letter-spacing:0.04em;
              background:var(--chip-soft);color:var(--chip-ink);border:1px solid #e3e3e3;
              border-color:color-mix(in srgb, var(--chip-solid) 28%, transparent)}
    @keyframes chip-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.96)}}

    .badge-provisional{display:inline-block;animation:badge-flash 1.8s ease-in-out infinite}
    @keyframes badge-flash{0%,100%{opacity:0.25}50%{opacity:0.7}}

    .chips-used-gws{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
    .chip-used-gw{font-family:var(--mono);font-size:0.6rem;color:var(--muted)}

    .gw-pts{font-family:var(--mono);font-weight:700;font-size:1rem}
    .total-pts{font-family:var(--mono);font-size:0.88rem}
    .pen-tag{font-size:0.68rem;color:var(--accent);font-family:var(--mono)}
    /* Penalties column stays red in both live and settled states. */
    thead th.pens-col{color:var(--accent)}
    .live-score{color:var(--live)}

    .to-play-cell{font-family:var(--mono);font-size:0.82rem;color:var(--muted)}
    .to-play-cell.has-some{color:var(--warn);font-weight:700}

    .see-players-btn{font-family:var(--font);font-size:0.68rem;font-weight:600;color:var(--accent);
               background:rgba(214,40,40,0.08);border:1px solid rgba(214,40,40,0.25);border-radius:6px;
               padding:4px 9px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background 0.15s}
    .see-players-btn:hover{background:rgba(214,40,40,0.16)}

    .gw-history-btn{font-family:var(--font);font-size:0.62rem;font-weight:600;color:var(--muted);
               background:#f0f0f0;border:1px solid var(--border);border-radius:6px;
               padding:4px 8px;cursor:pointer;white-space:nowrap;text-decoration:none;
               display:inline-block;margin-right:8px;transition:background 0.15s}
    .gw-history-btn:hover{background:#e6e6e6;color:var(--text)}

    .gw-picker{display:flex;align-items:center;justify-content:flex-end;gap:6px;
               flex-wrap:wrap;margin-top:6px;font-size:0.72rem;color:var(--muted)}
    .gw-select{font-family:var(--font);font-size:0.72rem;color:var(--text);background:var(--surface);
               border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer}
    .gw-past-note{font-size:0.68rem;color:var(--warn);font-weight:600;width:100%;text-align:right}
    @media (max-width:600px){
      .gw-picker{justify-content:flex-start}
      .gw-past-note{text-align:left}
    }

    tr.detail-row td{padding:0;border-bottom:1px solid var(--border)}
    .detail-inner{padding:16px 14px 16px 46px;display:grid;
                  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;background:#f9f9f9}
    .detail-item{display:flex;flex-direction:column;gap:2px}
    .detail-label{font-size:0.65rem;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}
    .detail-value{font-family:var(--mono);font-size:0.88rem}
    .detail-value.pen{color:var(--accent)}
    .detail-value.ok{color:var(--good)}

    .squad-section{padding:0 14px 16px 14px;background:#f9f9f9;border-top:1px solid var(--border)}
    .squad-header{display:flex;justify-content:space-between;padding:10px 0 6px;font-size:0.68rem;
                  letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);
                  border-bottom:1px solid var(--border);margin-bottom:4px}
    .squad-legend{font-family:var(--mono);letter-spacing:0;text-transform:none}
    .bench-divider{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;
                   color:#fff;background:var(--warn);border-radius:3px;padding:3px 8px;display:inline-block;
                   margin:10px 0 4px}
    .player-row{display:grid;grid-template-columns:36px 1fr 48px 48px 48px 48px;gap:8px;align-items:center;
                padding:5px 0;font-size:0.82rem;border-bottom:1px dashed #ececec}
    .player-row.bench{background:#fbeedd;padding:5px 6px;margin:0 -6px;border-left:3px solid var(--warn);
                      border-bottom:1px dashed #f0dcc0}
    .player-row.inactive{opacity:0.5}
    .player-pos{font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-align:center}
    .player-name{font-weight:500}
    .player-tag{display:inline-block;font-size:0.62rem;color:var(--warn);font-weight:700;margin-left:4px}
    .player-club{display:inline-block;font-size:0.6rem;color:var(--muted);letter-spacing:0.05em;margin-left:4px}
    .player-mins,.player-pts,.player-anti,.player-cost{font-family:var(--mono);text-align:right;font-size:0.8rem}
    .player-mins{color:var(--muted)}
    .player-anti{color:var(--accent);font-weight:600}
    .player-cost{color:var(--muted)}

    .fix-icon{display:inline-block;width:14px;text-align:center;font-size:0.7rem;margin-right:2px;font-weight:700}
    .fix-icon.done{color:var(--good)}
    .fix-icon.live{color:var(--live);animation:pulse 1.4s ease-in-out infinite}
    .fix-icon.upc{color:var(--warn);font-weight:800;font-size:0.8rem}

    .autosub-icon{display:inline-block;width:12px;text-align:center;font-size:0.65rem;font-weight:800;margin-right:1px}
    .autosub-icon.in{color:var(--good)}
    .autosub-icon.out{color:var(--accent)}

    .state-msg{max-width:900px;margin:80px auto;text-align:center;color:var(--muted);
               font-family:var(--mono);font-size:0.85rem;line-height:2}
    .state-msg .big{font-size:2rem;display:block;margin-bottom:12px}


    @media (max-width:600px){
      .logo{font-size:1.3rem}
      td,th{padding:10px 8px}
      .detail-inner{padding-left:14px}
    }
  </style>
  <script data-goatcounter="https://antifpl.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="logo_antifpl.png" alt="antifpl" class="logo-img">
  </div>
  <div class="meta">
    <div id="live-badge-wrap"></div>
    <div id="last-updated">—</div>
    <div id="gw-picker" class="gw-picker"></div>
  </div>
</header>

<div class="tabs">
  <a class="tab active" href="index.html">Overall antifpl</a>
  <a class="tab" href="players.html?from=index">Players</a>
  <a class="tab" href="rules.html">Rules</a>
</div>

<div class="gw-bar" id="gw-bar"></div>

<div class="table-wrap">
  <div id="state-msg" class="state-msg">Loading leaderboard...</div>
  <table id="leaderboard" style="display:none">
    <thead>
      <tr>
        <th data-key="rank">#</th>
        <th data-key="team">Team</th>
        <th class="r tight" data-key="toplay">To Play</th>
        <th class="r tight" data-key="gw" id="gw-header">GW Pre-Pens</th>
        <th class="r tight pens-col" data-key="pens" id="pens-header">GW Penalty Pts</th>
        <th class="r tight" data-key="prov" id="prov-header">Provisional GW Score</th>
        <th class="r" data-key="total" id="total-header">Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
  const SUPABASE_URL = 'https://qudcjhmbextpfdgdxihs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1ZGNqaG1iZXh0cGZkZ2R4aWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjEzMTQsImV4cCI6MjA5NDE5NzMxNH0.TRapf8KXSpM2XPrzprIhObi5cp0Sxt2wxel9novZRMA';
  const SEASON      = '2026/27';
  const REFRESH_MS  = 60 * 1000;

  let refreshTimer;
  let expandedTeam = null;
  let lastRenderArgs = null;
  let sortKey = 'total';
  let sortDir = 1;

  // Gameweek being VIEWED. null = follow the live/current GW. Must live out
  // here, not inside loadData(), because toggleExpand() re-runs loadData and
  // would otherwise reset it on every row expand.
  let viewGw = null;
  let latestGw = null;      // the real current GW, for the selector's range
  (function readUrlState() {
    const q = new URLSearchParams(location.search);
    const g = parseInt(q.get('gw'), 10);
    if (Number.isInteger(g) && g >= 1 && g <= 38) viewGw = g;
  })();

  function setViewGw(g) {
    viewGw = (g === latestGw) ? null : g;
    expandedTeam = null;
    const url = new URL(location.href);
    if (viewGw === null) url.searchParams.delete('gw');
    else url.searchParams.set('gw', viewGw);
    history.replaceState(null, '', url);
    loadData();
  }

  document.querySelectorAll('#leaderboard thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = 1; }
      if (lastRenderArgs) render(...lastRenderArgs);
    });
  });

  async function sbFetch(table, params = '') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!r.ok) throw new Error(`${table}: ${r.status} ${r.statusText}`);
    return r.json();
  }

  // Paginated fetch — needed for season-long, all-team queries that can exceed 1000 rows
  // (e.g. gw_rank history across ~80 teams × 38 GWs).
  async function sbFetchAll(table, params = '') {
    const rows = [];
    let offset = 0;
    while (true) {
      const sep = params ? '&' : '';
      const batch = await sbFetch(table, `${params}${sep}limit=1000&offset=${offset}`);
      rows.push(...batch);
      if (batch.length < 1000) break;
      offset += 1000;
    }
    return rows;
  }

  // Standard competition ("1,2,2,4") ranking: ties share the same rank and
  // the next distinct value skips ahead by the number of teams tied above it.
  // valueOf(row) — lower is better (anti-fpl totals/scores: lower = best).
  // Returns {rank(row), tied(row)} — tied() is true when 2+ rows share a rank.
  function competitionRank(rows, valueOf) {
    const sorted = [...rows].sort((a, b) => valueOf(a) - valueOf(b));
    const rankOf = new Map();
    let rank = 0, seen = 0, prevVal = null;
    sorted.forEach(r => {
      seen++;
      const v = valueOf(r);
      if (prevVal === null || v !== prevVal) { rank = seen; prevVal = v; }
      rankOf.set(r, rank);
    });
    const countByRank = {};
    rankOf.forEach(rk => { countByRank[rk] = (countByRank[rk] || 0) + 1; });
    return {
      rank: row => rankOf.get(row),
      tied: row => countByRank[rankOf.get(row)] > 1,
    };
  }

  // Weekly global lowest/highest-score "credit" badges — every team tied for
  // best (lowest) or worst (highest) anti_gw_pts in a GW shares the badge.
  // Stable once a GW is finished, so only refetched when the finished-GW
  // count changes, not on every silent 2-minute poll.
  let lastBadgeGw = null;
  window.weeklyBadges = {};
  async function refreshWeeklyBadges(completedGw) {
    if (completedGw < 1 || completedGw === lastBadgeGw) return;
    const rows = await sbFetchAll('gw_scores',
      `season=eq.${encodeURIComponent(SEASON)}&gw=lte.${completedGw}&select=team_id,gw,anti_gw_pts&order=gw.asc`);
    const byGw = {};
    rows.forEach(r => {
      if (typeof r.anti_gw_pts !== 'number') return;
      (byGw[r.gw] ||= []).push(r);
    });
    const badges = {};
    Object.values(byGw).forEach(gwRows => {
      const best  = Math.min(...gwRows.map(r => r.anti_gw_pts));
      const worst = Math.max(...gwRows.map(r => r.anti_gw_pts));
      gwRows.forEach(r => {
        badges[r.team_id] ||= { stars: 0, circles: 0 };
        if (r.anti_gw_pts === best)  badges[r.team_id].stars++;
        if (r.anti_gw_pts === worst) badges[r.team_id].circles++;
      });
    });
    window.weeklyBadges = badges;
    lastBadgeGw = completedGw;
  }

  // Provisional badge for the CURRENT (still-live) GW only — anti_gw_pts
  // updates every live tick, so this can still flip before the GW is
  // confirmed. Rendered faded + pulsing so it reads as "not locked in yet".
  window.provisionalBadges = {};
  async function refreshProvisionalBadge(currentGw, isLive) {
    window.provisionalBadges = {};
    if (!isLive) return;
    const rows = await sbFetch('gw_scores',
      `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw}&select=team_id,anti_gw_pts`);
    const valid = rows.filter(r => typeof r.anti_gw_pts === 'number');
    if (!valid.length) return;
    const best  = Math.min(...valid.map(r => r.anti_gw_pts));
    const worst = Math.max(...valid.map(r => r.anti_gw_pts));
    valid.forEach(r => {
      window.provisionalBadges[r.team_id] = { star: r.anti_gw_pts === best, circle: r.anti_gw_pts === worst };
    });
  }

  async function loadData() {
    try {
      const gwData = await sbFetch('gameweeks',
        `season=eq.${encodeURIComponent(SEASON)}&is_current=eq.true&select=*&limit=1`);
      let currentGw, isLive;
      if (gwData.length > 0) {
        currentGw = gwData[0].gw;
        isLive = !gwData[0].is_finished;
      } else {
        const latest = await sbFetch('gw_scores',
          `season=eq.${encodeURIComponent(SEASON)}&select=gw&order=gw.desc&limit=1`);
        currentGw = latest[0]?.gw || 1;
        isLive = false;
      }

      // Viewing a past GW: pin to it, and force isLive false. gwPtsOf/totalOf
      // branch on isLive and would otherwise show raw FPL points instead of
      // anti points, and recompute Total as prevTotal + gw.
      latestGw = currentGw;
      // Normalise first: a ?gw= at or beyond the current GW just means "live".
      if (viewGw !== null && viewGw >= latestGw) viewGw = null;
      if (viewGw !== null) {
        currentGw = viewGw;
        isLive = false;
      }

      // ALL eligible teams (no mini-league filter on this page)
      let teamsFilter = `season=eq.${encodeURIComponent(SEASON)}&eligible=eq.true&select=team_id,manager,team_name&limit=1000`;
      const teams = await sbFetch('teams', teamsFilter);
      const teamIdList = teams.map(t => t.team_id);
      if (!teamIdList.length) {
        showError('No eligible teams found.');
        return;
      }

      const scores = await sbFetch('gw_scores',
        `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw}&team_id=in.(${teamIdList.join(',')})&select=*&limit=1000`);

      const prevScores = currentGw > 1
        ? await sbFetch('gw_scores',
            `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw - 1}&team_id=in.(${teamIdList.join(',')})&select=team_id,cumulative_standing,anti_total&limit=1000`)
        : [];

      const selections = await sbFetch('team_gw_selections',
        `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw}&team_id=in.(${teamIdList.join(',')})&select=*&limit=1000`);

      const playerIds = new Set();
      selections.forEach(s => (s.squad || []).forEach(pid => playerIds.add(pid)));
      const playerScores = playerIds.size
        ? await sbFetch('player_gw_scores',
            `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw}&player_id=in.(${[...playerIds].join(',')})&select=*`)
        : [];

      if (!window.playerNames) {
        const allPlayers = await sbFetch('players',
          `season=eq.${encodeURIComponent(SEASON)}&select=player_id,web_name,position,team_short,team_id,now_cost&limit=1000`);
        window.playerNames = Object.fromEntries(allPlayers.map(p => [p.player_id, p.web_name]));
        window.playerPositions = Object.fromEntries(allPlayers.map(p => [p.player_id, p.position]));
        window.playerTeams = Object.fromEntries(allPlayers.map(p => [p.player_id, p.team_short]));
        window.playerTeamIds = Object.fromEntries(allPlayers.map(p => [p.player_id, p.team_id]));
        window.playerCosts = Object.fromEntries(allPlayers.map(p => [p.player_id, p.now_cost]));
      }

      // Fixtures for the current GW
      const fixtures = await sbFetch('fixtures',
        `season=eq.${encodeURIComponent(SEASON)}&gw=eq.${currentGw}&select=*`);
      const clubStatus = {};
      fixtures.forEach(f => {
        let st;
        if (f.finished || f.finished_provisional) st = 'finished';
        else if (f.started)                       st = 'live';
        else                                      st = 'upcoming';
        clubStatus[f.team_h] = st;
        clubStatus[f.team_a] = st;
      });
      window.clubStatus = clubStatus;

      const tids = scores.map(s => s.team_id);
      const chipsRows = tids.length
        ? await sbFetch('gw_scores',
            `season=eq.${encodeURIComponent(SEASON)}&team_id=in.(${tids.join(',')})&active_chip=neq.&select=team_id,gw,active_chip&limit=5000`)
        : [];
      const chipsByTeam = {};
      chipsRows.forEach(r => {
        if (!chipsByTeam[r.team_id]) chipsByTeam[r.team_id] = [];
        chipsByTeam[r.team_id].push({ gw: r.gw, chip: r.active_chip });
      });

      const prevTotal    = Object.fromEntries(prevScores.map(r => [r.team_id, r.anti_total]));
      const teamInfo     = Object.fromEntries(teams.map(t => [t.team_id, t]));
      const selectionMap = Object.fromEntries(selections.map(s => [s.team_id, s]));
      const playerScoreMap = Object.fromEntries(playerScores.map(p => [p.player_id, p]));

      const completedGw = isLive ? currentGw - 1 : currentGw;
      await Promise.all([
        refreshWeeklyBadges(completedGw),
        refreshProvisionalBadge(currentGw, isLive),
      ]);

      lastRenderArgs = [scores, teamInfo, prevTotal, currentGw, isLive,
                        selectionMap, playerScoreMap, chipsByTeam];
      render(...lastRenderArgs);
    } catch (err) {
      console.error('loadData error:', err);
      showError(err.message);
    } finally {
      // MUST be in `finally`. It used to be the last statement of the `try`,
      // so a single failed poll (one transient Supabase blip) killed
      // auto-refresh permanently until the user manually reloaded.
      scheduleRefresh();
    }
  }

  function buildChipsRow(usedChips, activeChip, currentGw) {
    const chipOrder = ['wildcard', 'freehit', 'bboost', '3xc'];
    const chipShort = { wildcard: 'WC', freehit: 'FH', bboost: 'BB', '3xc': 'TC' };
    // Per-chip colour class — see the chip colour system in the CSS above.
    const chipCls   = { wildcard: 'chip-wc', freehit: 'chip-fh', bboost: 'chip-bb', '3xc': 'chip-tc' };
    const usedCount = {};
    const activeThisGw = {};
    usedChips.forEach(c => {
      usedCount[c.chip] = (usedCount[c.chip] || 0) + 1;
      if (c.gw === currentGw) activeThisGw[c.chip] = true;
    });
    const items = [];
    chipOrder.forEach(name => {
      const used = usedCount[name] || 0;
      const isActive = activeChip === name && activeThisGw[name];
      for (let i = 1; i <= 2; i++) {
        let cls;
        if (i <= used && isActive && i === used) cls = 'chip-live';
        else if (i <= used) cls = 'chip-used';
        else cls = 'chip-avail';
        items.push(`<span class="chip-pill ${chipCls[name]} ${cls}" title="${chipShort[name]}">${chipShort[name]}</span>`);
      }
    });
    return `<div class="chips-row">${items.join('')}</div>`;
  }

  // Small permanent "TC · GW1" style line under the chip pills for every chip already played
  function buildChipsUsedGwsLine(usedChips) {
    if (!usedChips.length) return '';
    const chipShort = { wildcard: 'WC', freehit: 'FH', bboost: 'BB', '3xc': 'TC' };
    const sorted = [...usedChips].sort((a, b) => a.gw - b.gw);
    const items = sorted.map(c =>
      `<span class="chip-used-gw">${chipShort[c.chip] || c.chip} · GW${c.gw}</span>`);
    return `<div class="chips-used-gws">${items.join('')}</div>`;
  }

  // Count squad players whose fixture hasn't finished yet (upcoming, or live with 0 mins so far)
  function toPlayCount(squad) {
    if (!squad || !squad.length) return null;
    return squad.reduce((count, pid) => {
      const clubId   = window.playerTeamIds?.[pid];
      const fixState = window.clubStatus?.[clubId] || 'unknown';
      if (fixState === 'finished') return count;
      return count + 1;
    }, 0);
  }

  // Mirrors Backend/scoring.py's _valid_formation() exactly — must stay in sync.
  function validFormation(ids, typeOf) {
    const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
    ids.forEach(pid => { counts[typeOf(pid)] = (counts[typeOf(pid)] || 0) + 1; });
    return counts[1] === 1 && counts[2] >= 3 && counts[3] >= 2 && counts[4] >= 1;
  }

  // Mirrors Backend/scoring.py's infer_autosubs() exactly — must stay in sync.
  // Only credits a sub once BOTH the blank starter's and the covering bench
  // player's own fixtures are finished, so — like the live pending-penalty
  // floor — a sub shown here is never later reversed as more fixtures resolve.
  function inferAutoSubs(starterIds, benchIds, typeOf, finishedSet, minsOf) {
    const xi = starterIds.slice();
    for (const bpId of benchIds) {
      if (!finishedSet.has(bpId) || minsOf(bpId) === 0) continue;
      const bpGk = typeOf(bpId) === 1;
      for (let i = 0; i < xi.length; i++) {
        const spId = xi[i];
        if (!finishedSet.has(spId) || minsOf(spId) > 0) continue;
        if ((typeOf(spId) === 1) !== bpGk) continue;
        const test = xi.slice();
        test[i] = bpId;
        if (!validFormation(test, typeOf)) continue;
        xi[i] = bpId;
        break;
      }
    }
    return xi;
  }

  function render(scores, teamInfo, prevTotal, gw, isLive,
                  selectionMap, playerScoreMap, chipsByTeam) {
    document.getElementById('live-badge-wrap').innerHTML = isLive
      ? `<div class="live-badge"><span class="live-dot"></span>LIVE · GW${gw}</div>`
      : `<div style="font-size:0.72rem;color:var(--muted)">GW${gw} · Final</div>`;

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `Updated ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;

    // A team's GW contribution: once its GW score is provisional (fixtures
    // done, awaiting FPL's official confirmation) the backend has already
    // computed the real anti-adjusted score, so use that instead of the raw
    // live points — this is also what feeds the Total/ranking column below.
    const gwPtsOf = s => s.anti_gw_pts ?? ((s.fpl_raw_pts ?? 0) + (s.total_pens_gw ?? 0));
    const totalOf = s => isLive ? ((prevTotal[s.team_id] ?? 0) + gwPtsOf(s)) : (s.anti_total ?? 99999);

    // Standard competition ranking (ties share a rank; e.g. 1,2,2,4) — the
    // rank number shown never changes with the user's chosen sort column.
    const rankMap = competitionRank(scores, totalOf);
    const prevRankMap = competitionRank(
      scores.filter(s => prevTotal[s.team_id] != null),
      s => prevTotal[s.team_id]);

    const displayPts = scores.map(gwPtsOf);
    const best  = displayPts.length ? Math.min(...displayPts) : 0;
    const worst = displayPts.length ? Math.max(...displayPts) : 0;
    const avg   = displayPts.length ? (displayPts.reduce((a, b) => a + b, 0) / displayPts.length).toFixed(1) : '0.0';

    // Row display order follows the clicked column header; the rank number
    // in the "#" column always reflects true Total standings (rankMap above).
    const sortValue = s => {
      switch (sortKey) {
        case 'team':   return (teamInfo[s.team_id]?.team_name || '').toLowerCase();
        case 'gw':     return s.fpl_raw_pts ?? 0;
        case 'toplay': return toPlayCount(selectionMap[s.team_id]?.squad?.slice(0, 11)) ?? -1;
        case 'pens':   return s.total_pens_gw ?? 0;
        case 'prov':   return gwPtsOf(s);
        case 'rank':
        case 'total':
        default:       return totalOf(s);
      }
    };
    const sorted = [...scores].sort((a, b) => {
      const av = sortValue(a), bv = sortValue(b);
      return sortDir * (typeof av === 'string' ? av.localeCompare(bv) : av - bv);
    });

    document.querySelectorAll('#leaderboard thead th[data-key]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.key === sortKey);
    });

    // Top-N% Avg GW Score: N = 3 for small leagues (<=30 teams), else floor(10%).
    // Averages the current-GW score of the N teams currently leading the table.
    const byRank = [...scores].sort((a, b) => totalOf(a) - totalOf(b));
    const topN = byRank.length <= 30 ? Math.min(3, byRank.length) : Math.floor(byRank.length * 0.10);
    const topNPts = byRank.slice(0, topN).map(gwPtsOf);
    const topNAvg = topNPts.length ? (topNPts.reduce((a, b) => a + b, 0) / topNPts.length).toFixed(1) : '0.0';

    // Chips played THIS gameweek. active_chip is already on every score row,
    // so this is a fold over data we have — same figures as the stats page.
    const CHIP_PILL = [
      { key: 'wildcard', label: 'WC', cls: 'chip-wc' },
      { key: 'freehit',  label: 'FH', cls: 'chip-fh' },
      { key: 'bboost',   label: 'BB', cls: 'chip-bb' },
      { key: '3xc',      label: 'TC', cls: 'chip-tc' },
    ];
    const chipTally = Object.fromEntries(CHIP_PILL.map(c => [c.key, 0]));
    scores.forEach(sc => {
      const c = (sc.active_chip || '').toLowerCase();
      if (c in chipTally) chipTally[c]++;
    });
    const chipsActive = CHIP_PILL.reduce((a, c) => a + chipTally[c.key], 0);
    const chipBreakdown = CHIP_PILL.filter(c => chipTally[c.key] > 0)
      .map(c => `<span class="chip-tag ${c.cls}">${chipTally[c.key]} ${c.label}</span>`)
      .join(' ') || '<span style="opacity:.6">none</span>';

    document.getElementById('gw-bar').innerHTML = `
      <div class="gw-pills">
        <div class="gw-pill"><strong>${gw}</strong>Gameweek</div>
        <div class="gw-pill"><strong>${scores.length}</strong>Teams</div>
        <div class="gw-pill"><strong>${best}</strong>Best GW score</div>
        <div class="gw-pill"><strong>${worst}</strong>Worst GW score</div>
        <div class="gw-pill"><strong>${avg}</strong>GW average</div>
        <div class="gw-pill"><strong>${topNAvg}</strong>Top ${topN} Avg GW Score</div>
        <div class="gw-pill" title="Chips played by this table's teams in GW${gw}">
          <strong>${chipsActive}</strong>Chips active &middot; ${chipBreakdown}
        </div>
      </div>

      <a class="gw-history-btn" href="weekly_stats.html?from=index" style="align-self:center">Overall antifpl weekly stats</a>
    `;
    // Rendered into a FIXED slot in the header (under the updated time) rather
    // than inside the stats bar, so it never shifts around as pills reflow —
    // which is what made it jump on mobile.
    document.getElementById('gw-picker').innerHTML = `
      <label for="gw-select">View</label>
      <select class="gw-select" id="gw-select">
        ${Array.from({length: latestGw || gw}, (_, i) => i + 1).reverse().map(n =>
          `<option value="${n}"${n === gw ? ' selected' : ''}>GW${n}${n === latestGw ? ' (live)' : ''}</option>`
        ).join('')}
      </select>
      ${viewGw !== null && viewGw !== latestGw
        ? '<div class="gw-past-note">past GW — not auto-refreshing</div>' : ''}
    `;
    document.getElementById('gw-select')
      .addEventListener('change', e => setViewGw(parseInt(e.target.value, 10)));

    // Three GW columns, each a fixed, unambiguous quantity — no live/finished
    // branching needed on VALUE any more, only on wording. This replaced a
    // single "GW" column that silently swapped between raw and anti-adjusted
    // depending on state, which was the actual source of confusion.
    const gwHead   = document.getElementById('gw-header');
    const pensHead = document.getElementById('pens-header');
    const provHead = document.getElementById('prov-header');
    const totHead  = document.getElementById('total-header');

    const subNote = 'Auto-subs ARE included, applied progressively as each fixture finishes — '
                  + 'a blank starter only counts once the bench player who could replace them has played.';

    gwHead.title = 'Raw FPL score for the gameweek — before any anti penalties. ' + subNote;

    pensHead.title = isLive
      ? 'Anti penalties confirmed SO FAR this GW. Bank and transfer-hit penalties '
      + 'apply immediately; inactive-player and captain/vice penalties are only '
      + 'added once the relevant fixtures have finished, so this can still rise.'
      : 'Final anti penalties for the gameweek.';

    // "Provisional" while the GW can still move, "GW Score" once nothing about
    // it can change any more.
    provHead.textContent = isLive ? 'Provisional GW Score' : 'GW Score';
    provHead.title = 'GW Pre-Pens + GW Penalty Pts. ' + (isLive
      ? 'Still LIVE — will keep changing as penalties confirm and players finish. '
        + 'Rows marked ~ have all their fixtures done and are awaiting official confirmation from FPL.'
      : 'Final for the gameweek.');

    totHead.textContent = 'Total';
    totHead.style.color = '';        // inherit the default grey header colour
    totHead.title = isLive
      ? 'Running season total: previous total plus the Provisional GW Score on the left.'
      : 'Season anti total, penalties and auto-subs included.';

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    sorted.forEach((s) => {
      const info       = teamInfo[s.team_id] || {};
      const pos        = rankMap.rank(s);
      const posTied    = rankMap.tied(s);
      const prevPos    = prevRankMap.rank(s);
      const move       = prevPos ? prevPos - pos : 0;
      const activeChip = s.active_chip || '';
      const hasPens    = s.total_pens_gw > 0;
      const isExpanded = expandedTeam === s.team_id;
      const prevTot    = prevTotal[s.team_id];
      const selection  = selectionMap[s.team_id];

      const toPlay = toPlayCount(selection?.squad?.slice(0, 11));
      const toPlayHtml = toPlay == null ? '—'
        : `<span class="to-play-cell ${toPlay > 0 ? 'has-some' : ''}">${toPlay} to play</span>`;

      const isProvisional = isLive && !!s.is_provisional;
      // Only show the "~" while this team still has a starter left to play —
      // once their own XI is all done, the GW-wide is_provisional flag (waiting
      // on FPL's official confirmation) shouldn't keep offsetting this row.
      const showProvBadge = isProvisional && (toPlay == null || toPlay > 0);
      const provBadge = '<span title="Provisional — awaiting FPL official confirmation" style="font-size:9px;color:var(--muted);vertical-align:super;margin-left:2px">~</span>';
      // GW Provisional Score = GW Pre-Pens + GW Penalty Pts, always — see the
      // gwPtsOf comment above for why no live/finished branch is needed here.
      const provScore   = gwPtsOf(s);
      const displayProv = showProvBadge ? `${provScore}${provBadge}` : provScore;
      const displayTot = isLive ? ((prevTot ?? 0) + gwPtsOf(s)) : (s.anti_total ?? '—');

      const moveStr = move > 0
        ? `<span style="color:var(--good);font-size:0.65rem"> ▲${move}</span>`
        : move < 0
        ? `<span style="color:var(--accent);font-size:0.65rem"> ▼${Math.abs(move)}</span>`
        : '';

      const chipsHtml   = buildChipsRow(chipsByTeam[s.team_id] || [], activeChip, gw);
      const chipsGwHtml = buildChipsUsedGwsLine(chipsByTeam[s.team_id] || []);
      const badges      = window.weeklyBadges?.[s.team_id];
      const provBadges  = window.provisionalBadges?.[s.team_id];
      const confirmedBadgeHtml = badges
        ? `${badges.stars > 0 ? `<span title="Lowest score of the week ×${badges.stars}">${'⭐'.repeat(badges.stars)}</span>` : ''}${badges.circles > 0 ? `<span title="Highest score of the week ×${badges.circles}">${'⚫'.repeat(badges.circles)}</span>` : ''}`
        : '';
      const provisionalBadgeHtml = provBadges
        ? `${provBadges.star ? `<span class="badge-provisional" title="Provisional — lowest score this week, not yet confirmed">⭐</span>` : ''}${provBadges.circle ? `<span class="badge-provisional" title="Provisional — highest score this week, not yet confirmed">⚫</span>` : ''}`
        : '';
      const badgeHtml = confirmedBadgeHtml + provisionalBadgeHtml;

      const tr = document.createElement('tr');
      tr.className = `team-row${isExpanded ? ' expanded' : ''}`;
      tr.innerHTML = `
        <td class="pos ${pos <= 3 ? 'top3' : ''}">${posTied ? '=' : ''}${pos}${moveStr}</td>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <button type="button" class="see-players-btn">See team</button>
            <div>
              <div class="team-name">
                <a href="https://fantasy.premierleague.com/entry/${s.team_id}/event/${gw}"
                   target="_blank" rel="noopener"
                   style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)"
                   onclick="event.stopPropagation()">${info.team_name || s.team_id}</a>
                ${badgeHtml ? `<span style="font-size:0.7rem;margin-left:4px">${badgeHtml}</span>` : ''}
              </div>
              <div class="manager-name">${info.manager || ''}</div>
              ${chipsHtml}
              ${chipsGwHtml}
            </div>
          </div>
        </td>
        <td class="r tight">${toPlayHtml}</td>
        <td class="r tight"><div class="gw-pts">${s.fpl_raw_pts ?? '—'}</div></td>
        <td class="r tight">${hasPens
          ? `<span class="pen-tag">+${s.total_pens_gw}</span>`
          : '<span style="color:var(--muted)">—</span>'}</td>
        <td class="r tight"><div class="gw-pts prov-pts ${isLive && !isProvisional ? 'live-score' : ''}">${displayProv}</div></td>
        <td class="r total-pts">${displayTot}</td>
        <td style="text-align:right">
          <a href="team_history.html?team_id=${s.team_id}" class="gw-history-btn" onclick="event.stopPropagation()">GW History</a>
        </td>
      `;
      tr.addEventListener('click', () => toggleExpand(s.team_id));
      tr.querySelector('.see-players-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleExpand(s.team_id);
      });
      tbody.appendChild(tr);

      let squadHtml = '';
      if (selection?.squad?.length) {
        const captainId = selection.captain_id;
        const viceId = selection.vice_captain_id;

        // Auto-subs: only meaningful outside Bench Boost (where all 15 count as-is).
        const starterIds = selection.squad.slice(0, 11);
        const benchIds   = selection.squad.slice(11);
        const posTypeOf  = (pid) => ({ GKP: 1, DEF: 2, MID: 3, FWD: 4 }[window.playerPositions?.[pid]] || 3);
        const finishedSet = new Set(selection.squad.filter(pid =>
          window.clubStatus?.[window.playerTeamIds?.[pid]] === 'finished'));
        const minsOf = (pid) => playerScoreMap[pid]?.minutes ?? 0;

        const subbedOutIds = new Set();
        const subbedInIds  = new Set();
        if (activeChip !== 'bboost') {
          const effectiveXi = inferAutoSubs(starterIds, benchIds, posTypeOf, finishedSet, minsOf);
          starterIds.forEach(pid => { if (!effectiveXi.includes(pid)) subbedOutIds.add(pid); });
          effectiveXi.forEach(pid => { if (!starterIds.includes(pid)) subbedInIds.add(pid); });
        }

        const renderPlayer = (pid, i, isStarter) => {
          const isCap = pid === captainId;
          const isVice = pid === viceId;
          const p = playerScoreMap[pid] || {};
          const name = (window.playerNames && window.playerNames[pid]) || `#${pid}`;
          const posShort = (window.playerPositions && window.playerPositions[pid]) || '';
          const club = (window.playerTeams && window.playerTeams[pid]) || '';
          const clubId = window.playerTeamIds?.[pid];
          const fixState = window.clubStatus?.[clubId] || 'unknown';
          // Captain multiplier isn't stored pre-applied in Supabase — base_pts/anti_pts
          // are always the player's raw single score, so it's applied here for display.
          const capMult = isCap ? (activeChip === '3xc' ? 3 : 2) : 1;
          const tag = isCap ? `(C×${capMult})` : isVice ? '(V)' : '';
          const rawPts   = p.base_pts != null ? p.base_pts : null;
          const rawAnti  = p.anti_pts != null ? p.anti_pts : null;
          // anti_pts = base_pts + a flat +9 if the player blanked — multiply only the
          // base portion, then re-add that flat penalty untouched.
          const penaltyPortion = (rawAnti != null && rawPts != null) ? (rawAnti - rawPts) : 0;
          const pts     = rawPts  != null ? rawPts * capMult : '—';
          const antiPts = rawAnti != null ? (rawPts * capMult) + penaltyPortion : '—';
          const mins = p.minutes != null ? p.minutes : '—';
          const inactive = p.minutes === 0;
          const cost = window.playerCosts?.[pid];
          const costStr = cost != null ? `£${(cost / 10).toFixed(1)}m` : '—';
          let fixIcon = '';
          if (fixState === 'finished')      fixIcon = '<span class="fix-icon done" title="Fixture finished">✓</span>';
          else if (fixState === 'live')     fixIcon = '<span class="fix-icon live" title="Fixture in play">●</span>';
          else if (fixState === 'upcoming') fixIcon = '<span class="fix-icon upc"  title="Yet to play">?</span>';
          const autoSubIcon = subbedOutIds.has(pid)
            ? '<span class="autosub-icon out" title="Auto-subbed out">▼</span>'
            : subbedInIds.has(pid)
            ? '<span class="autosub-icon in" title="Auto-subbed in">▲</span>'
            : '';
          return `
            <div class="player-row ${isStarter ? '' : 'bench'} ${inactive ? 'inactive' : ''}">
              <span class="player-pos">${posShort || (isStarter ? i+1 : 'B')}</span>
              <span class="player-name">${fixIcon}${autoSubIcon} ${name}
                ${club ? `<span class="player-club">${club}</span>` : ''}
                ${tag ? `<span class="player-tag">${tag}</span>` : ''}
              </span>
              <span class="player-mins">${mins}'</span>
              <span class="player-pts">${pts}</span>
              <span class="player-anti">${antiPts}</span>
              <span class="player-cost">${costStr}</span>
            </div>
          `;
        };

        const starterRows = selection.squad.slice(0, 11).map((pid, i) => renderPlayer(pid, i, true)).join('');
        const benchRows   = selection.squad.slice(11).map((pid, i) => renderPlayer(pid, i, false)).join('');
        squadHtml = `
          <div class="squad-section">
            <div class="squad-header">
              <span>Squad (GW${gw})</span>
              <span class="squad-legend" title="&#9650; auto-subbed in, &#9660; auto-subbed out — both already counted in the score above">&#9650;&#9660; auto-subs applied &middot; mins · pts · anti · cost</span>
            </div>
            ${starterRows}
            <div class="bench-divider">Bench</div>
            ${benchRows}
          </div>
        `;
      }

      const penPrefix = isLive ? 'Penalty Pts: ' : '';
      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.style.display = isExpanded ? '' : 'none';
      detailTr.innerHTML = `
        <td colspan="8">
          <div class="detail-inner">
            ${detailItem('Prev Total', prevTot ?? '—', false, false, 'Season total going into this gameweek')}
            ${detailItem(penPrefix + 'Transfer Hits', s.hit_pts || 0, s.hit_pts > 0)}
            ${detailItem('Squad Value', s.team_value != null ? `£${(s.team_value / 10).toFixed(1)}m` : '—', false, false, 'Selling value of the 15-man squad — settles once the gameweek finalises')}
            ${detailItem('Bank', s.bank != null ? `£${(s.bank / 10).toFixed(1)}m` : '—', false, s.bank_pen)}
            ${detailItem(penPrefix + 'Bank Pen', s.bank_pen_pts || 0, s.bank_pen_pts > 0)}
            ${detailItem('Inactive Players', s.inactive_count ?? '—')}
            ${detailItem(penPrefix + 'Inactive Pen', s.inactive_pen_pts || 0, s.inactive_pen_pts > 0)}
            ${detailItem(penPrefix + 'C/VC Pen', s.cvc_pen_pts || 0, s.cvc_pen_pts > 0)}
            ${detailItem(penPrefix + 'Chip Pen', s.chip_pen_pts || 0, s.chip_pen_pts > 0)}
            ${s.unused_chips?.length ? detailItem('Unused Chips', s.unused_chips.join(', '), true) : ''}
          </div>
          ${squadHtml}
        </td>
      `;
      tbody.appendChild(detailTr);
    });

    document.getElementById('state-msg').style.display = 'none';
    document.getElementById('leaderboard').style.display = '';
  }

  function detailItem(label, value, isPen = false, isWarn = false, tip = '') {
    const cls = (isPen || isWarn) ? 'pen' : value === 0 ? 'ok' : '';
    const t = tip ? ` title="${tip}"` : '';
    return `<div class="detail-item"${t}><span class="detail-label">${label}</span><span class="detail-value ${cls}">${value}</span></div>`;
  }

  function toggleExpand(teamId) {
    expandedTeam = (expandedTeam === teamId) ? null : teamId;
    loadData();
  }

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    // A finished GW never changes — polling it every 2 min is pure waste.
    if (viewGw !== null && latestGw !== null && viewGw !== latestGw) return;
    refreshTimer = setTimeout(loadData, REFRESH_MS);
  }

  function showError(msg) {
    document.getElementById('state-msg').innerHTML = `
      Failed to load data<br>
      <span style="font-size:0.75rem">${msg}</span>
    `;
    document.getElementById('state-msg').style.display = '';
    document.getElementById('leaderboard').style.display = 'none';
  }

  loadData();
</script>
</body>
</html>
