<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>antifpl · Weekly Stats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#fff; --surface:#fff; --border:#e0e0e0;
      --text:#111; --muted:#888;
      --accent:#d62828; --good:#1a7f4b; --warn:#b86e00; --live:#d62828;
      --font:'Inter',system-ui,sans-serif;
      --mono:'JetBrains Mono','Fira Code',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:24px 16px 48px}

    header{max-width:1000px;margin:0 auto 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .logo-wrap{background:#fff;display:inline-block;line-height:0}
    .logo-img{height:120px;width:auto;display:block}
    .meta{text-align:right;font-size:0.78rem;color:var(--muted);font-family:var(--mono);line-height:1.8}

    .tabs{max-width:1000px;margin:0 auto 24px;display:flex;border-bottom:1px solid var(--border);gap:0;flex-wrap:wrap}
    .tab{padding:10px 18px;font-size:0.82rem;font-weight:600;color:var(--muted);
         border-bottom:2px solid transparent;cursor:pointer;text-decoration:none;transition:all 0.2s}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--text);border-bottom-color:var(--accent)}
    .tab .gw-part{color:var(--text)}
    .tab .stats-part{color:var(--accent)}

    .gw-bar{max-width:1000px;margin:0 auto 20px;font-size:0.82rem;color:var(--muted)}

    .chip-stats-bar{max-width:1000px;margin:0 auto 20px;display:flex;gap:12px;flex-wrap:wrap}
    .chip-stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;
             padding:10px 16px;font-size:0.78rem;color:var(--muted);flex:1 1 200px}
    .chip-stat-pill .csp-label{font-weight:700;color:var(--text);font-size:0.7rem;
             letter-spacing:0.04em;text-transform:uppercase}
    .chip-stat-pill .csp-score{color:var(--text);font-size:1.3rem;font-family:var(--mono);
             font-weight:600;margin-top:4px}
    .chip-stat-pill .csp-meta{margin-top:2px}
    .chip-stat-pill .csp-meta a{color:var(--muted);text-decoration:none}
    .chip-stat-pill .csp-meta a:hover{color:var(--text);text-decoration:underline}

    .panel{max-width:1000px;margin:0 auto 20px;background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:16px}
    .charts-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
    .charts-toggle-label{font-size:0.75rem;color:var(--muted);font-family:var(--mono)}
    .charts-toggle:hover .charts-toggle-label{color:var(--text)}
    .panel-title{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
      color:var(--muted)}
    .chart-wrap{position:relative;height:280px;margin-top:16px}
    .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:0.72rem;color:var(--muted)}
    .chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
    /* Chip colours, identical to the dashboards' --chip-* custom properties */
    .chip-cell{font-weight:600}
    .chip-cell.wc{color:#7c3aed}
    .chip-cell.fh{color:#b86e00}
    .chip-cell.bb{color:#0891b2}
    .chip-cell.tc{color:#d62828}
    .chip-col{white-space:nowrap}

    .table-wrap{max-width:1000px;margin:0 auto;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:0.83rem}
    thead th{text-align:left;padding:9px 12px;font-size:0.65rem;font-weight:600;letter-spacing:0.06em;
             color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;
             user-select:none}
    thead th:hover{color:var(--text)}
    thead th.r{text-align:left}
    thead th.sorted{color:var(--accent)}
    tbody tr{border-bottom:1px solid var(--border)}
    tbody tr:hover{background:#fafafa}
    td{padding:9px 12px;vertical-align:middle;white-space:nowrap}
    td.r{text-align:left;font-family:var(--mono);font-size:0.82rem}
    td.gw-cell{font-weight:600}

    .state-msg{max-width:1000px;margin:80px auto;text-align:center;color:var(--muted);
               font-family:var(--mono);font-size:0.85rem;line-height:2}

    @media (max-width:600px){
      td,th{padding:8px 6px}
    }
  </style>
  <script data-goatcounter="https://antifpl.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="logo_antifpl.png" alt="antifpl" class="logo-img">
  </div>
  <div class="meta">
    <div id="last-updated">—</div>
  </div>
</header>

<div class="tabs" id="tabs-bar"></div>

<div class="gw-bar" id="gw-bar"></div>

<div class="chip-stats-bar" id="chip-stats-bar"></div>

<div class="panel">
  <div class="charts-toggle" id="charts-toggle">
    <span class="panel-title">Charts</span>
    <span class="charts-toggle-label" id="charts-toggle-label">Show &#x25BE;</span>
  </div>
  <div id="charts-body" style="display:none">
    <div class="chart-wrap"><canvas id="stats-chart"></canvas></div>
    <div class="chart-legend" id="chart-legend"></div>
    <div class="chart-wrap"><canvas id="chips-chart"></canvas></div>
    <div class="chart-legend" id="chips-legend"></div>
  </div>
</div>

<div class="table-wrap">
  <div id="state-msg" class="state-msg">Loading weekly stats...</div>
  <table id="stats-table" style="display:none">
    <thead>
      <tr>
        <th data-key="gw">GW</th>
        <th class="r" data-key="teams">Teams</th>
        <th class="r" data-key="best" title="Lowest (best) GW score">Best</th>
        <th class="r" data-key="worst" title="Highest (worst) GW score">Worst</th>
        <th class="r" data-key="avg">Average</th>
        <th class="r" data-key="topNAvg" title="Average GW score of the teams currently leading the table">Top N Avg</th>
        <th class="r chip-col" data-key="wc" title="Wildcards played this GW">WC</th>
        <th class="r chip-col" data-key="fh" title="Free Hits played this GW">FH</th>
        <th class="r chip-col" data-key="bb" title="Bench Boosts played this GW">BB</th>
        <th class="r chip-col" data-key="tc" title="Triple Captains played this GW">TC</th>
        <th data-key="topCaptCount" title="Most-picked captain this GW">Top Capt</th>
        <th data-key="topVcCount" title="Most-picked vice-captain this GW">Top VC</th>
        <th data-key="worstCaptPts" title="Captain(s) with the most points this GW — the anti-fpl pick that backfired hardest">Worst Capt</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
  const SUPABASE_URL = 'https://qudcjhmbextpfdgdxihs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1ZGNqaG1iZXh0cGZkZ2R4aWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjEzMTQsImV4cCI6MjA5NDE5NzMxNH0.TRapf8KXSpM2XPrzprIhObi5cp0Sxt2wxel9novZRMA';
  const SEASON = '2026/27';

  let ROWS = [];
  let sortKey = 'gw';
  let sortDir = 1;
  let TOP_N = null;  // set from the overall league's team count once loaded — never hardcode

  // Nav is context-sensitive: only show the mini-league link if we arrived via
  // mini_league.html's own "?from=mini_league" — otherwise a global (Overall)
  // visitor could use this page as a back door into a mini-league they weren't
  // given the invite code for. GWStats itself sits right after whichever tab
  // is the actual origin (mini-league or overall), rather than in a fixed
  // slot, so the nav reads as "you came from X, here's X's GW stats".
  (function renderNav() {
    const from = new URLSearchParams(location.search).get('from');
    const gwStatsTab = '<a class="tab active" href="weekly_stats.html' + (from ? `?from=${from}` : '') +
      '"><span class="gw-part">GW</span><span class="stats-part">Stats</span></a>';
    const links = [];
    if (from === 'mini_league') {
      links.push('<a class="tab" href="mini_league.html">The next Badly drawn boy</a>');
      links.push(gwStatsTab);
      links.push('<a class="tab" href="index.html">Overall antifpl</a>');
    } else {
      links.push('<a class="tab" href="index.html">Overall antifpl</a>');
      links.push(gwStatsTab);
    }
    links.push('<a class="tab" href="players.html' + (from ? `?from=${from}` : '') + '">Players</a>');
    links.push('<a class="tab" href="rules.html">Rules</a>');
    document.getElementById('tabs-bar').innerHTML = links.join('');
  })();

  async function sbFetch(table, params = '') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!r.ok) throw new Error(`${table}: ${r.status} ${r.statusText}`);
    return r.json();
  }

  // Paginated fetch — needed for season-long, all-team queries that can exceed 1000 rows.
  async function sbFetchAll(table, params = '') {
    const rows = [];
    let offset = 0;
    while (true) {
      const sep = params ? '&' : '';
      const batch = await sbFetch(table, `${params}${sep}limit=1000&offset=${offset}`);
      rows.push(...batch);
      if (batch.length < 1000) break;
      offset += 1000;
    }
    return rows;
  }

  function showError(msg) {
    document.getElementById('state-msg').innerHTML = msg;
    document.getElementById('state-msg').style.display = '';
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  async function loadData() {
    try {
      const teams = await sbFetch('teams',
        `season=eq.${encodeURIComponent(SEASON)}&eligible=eq.true&select=team_id,team_name&limit=1000`);
      const totalTeams = teams.length;
      const teamNameById = new Map(teams.map(t => [t.team_id, t.team_name]));

      // All teams, all GWs — anti_gw_pts (this week's score) + anti_total
      // (running total through this GW, used to find the current leaders for
      // the Top N Avg column) already live on every gw_scores row, so this
      // whole page is a pure client-side aggregation of existing data — no
      // new table or backend computation needed.
      const allRows = await sbFetchAll('gw_scores',
        `season=eq.${encodeURIComponent(SEASON)}&select=team_id,gw,anti_gw_pts,anti_total,active_chip&order=gw.asc`);

      // Captain/VC picks per GW — same table players.html reads for its
      // current-GW captain counts, here folded across the whole season.
      // Pure client-side aggregation, no new backend query shape.
      const players = await sbFetchAll('players',
        `season=eq.${encodeURIComponent(SEASON)}&select=player_id,web_name`);
      const nameById = new Map(players.map(p => [p.player_id, p.web_name]));

      const selections = await sbFetchAll('team_gw_selections',
        `season=eq.${encodeURIComponent(SEASON)}&select=gw,captain_id,vice_captain_id`);

      const bySelGw = {};
      selections.forEach(s => (bySelGw[s.gw] ||= []).push(s));

      // Mode of a list of ids, tie-broken by joining all leaders' names —
      // ties are common early season, so pick just one leader would mislead.
      function topPick(rows, key) {
        const counts = new Map();
        rows.forEach(s => {
          const id = s[key];
          if (id == null) return;
          counts.set(id, (counts.get(id) || 0) + 1);
        });
        if (!counts.size) return { leaders: [], max: 0 };
        const max = Math.max(...counts.values());
        const leaders = [...counts.entries()].filter(([, c]) => c === max).map(([id]) => id);
        return { leaders, max };
      }

      const topCaptByGw = {}, topVcByGw = {};
      Object.entries(bySelGw).forEach(([gw, rows]) => {
        topCaptByGw[gw] = topPick(rows, 'captain_id');
        topVcByGw[gw]   = topPick(rows, 'vice_captain_id');
      });

      // Raw (un-doubled) points those leaders actually scored, shown only for
      // GWs FPL has finished — a live GW's base_pts is still climbing, so
      // showing it there would look final when it isn't. Only fetch the
      // leaders' own rows (not every player's), since there are only a
      // handful of them across the whole season.
      const gwMeta = await sbFetchAll('gameweeks',
        `season=eq.${encodeURIComponent(SEASON)}&select=gw,is_finished`);
      const finishedGws = new Set(gwMeta.filter(g => g.is_finished).map(g => g.gw));

      // Worst Captain needs every captained player's points (to find the
      // minimum), not just the most-picked one, so the fetch below covers
      // every distinct captain/VC ever picked — still a small set (a
      // season's worth of players anyone actually captained), not the full
      // player pool.
      const leaderIds = new Set();
      selections.forEach(s => {
        if (s.captain_id != null)      leaderIds.add(s.captain_id);
        if (s.vice_captain_id != null) leaderIds.add(s.vice_captain_id);
      });

      const leaderScores = leaderIds.size
        ? await sbFetchAll('player_gw_scores',
            `season=eq.${encodeURIComponent(SEASON)}&player_id=in.(${[...leaderIds].join(',')})&select=player_id,gw,base_pts`)
        : [];
      const basePtsByKey = new Map(leaderScores.map(r => [`${r.gw}:${r.player_id}`, r.base_pts]));

      // Worst Captain: the captained player(s) with the MOST points that GW
      // — same golf-style "worst = highest" convention as the Best/Worst
      // columns. Anti-fpl rewards a captain who blanks, so the pick that
      // backfired hardest is whoever actually hauled (e.g. a "safe" Mendy/
      // Ajayi pick that unexpectedly returned big). Each tied player keeps
      // their own pick-count — unlike Top Capt, tied "worst" players don't
      // necessarily share the same pick-count.
      function formatWorstCapt(gw) {
        if (!finishedGws.has(Number(gw))) return { label: '—', pts: null };
        const rows = bySelGw[gw] || [];
        const counts = new Map();
        rows.forEach(s => {
          if (s.captain_id != null) counts.set(s.captain_id, (counts.get(s.captain_id) || 0) + 1);
        });
        if (!counts.size) return { label: '—', pts: null };
        let worstPts = null;
        counts.forEach((_, id) => {
          const pts = basePtsByKey.get(`${gw}:${id}`);
          if (pts != null && (worstPts == null || pts > worstPts)) worstPts = pts;
        });
        if (worstPts == null) return { label: '—', pts: null };
        const label = [...counts.entries()]
          .filter(([id]) => basePtsByKey.get(`${gw}:${id}`) === worstPts)
          .map(([id, count]) => `${count} × ${esc(nameById.get(id) || id)} (${worstPts}pt${worstPts === 1 ? '' : 's'})`)
          .join(' / ');
        return { label, pts: worstPts };
      }

      function formatPick({ leaders, max }, gw) {
        if (!leaders.length) return '—';
        const finished = finishedGws.has(Number(gw));
        const names = leaders.map(id => {
          const name = esc(nameById.get(id) || id);
          if (!finished) return name;
          const pts = basePtsByKey.get(`${gw}:${id}`);
          return pts != null ? `${name} (${pts}pt${pts === 1 ? '' : 's'})` : name;
        });
        return `${max} × ${names.join(' / ')}`;
      }

      const byGw = {};
      allRows.forEach(r => {
        if (typeof r.anti_gw_pts !== 'number') return;
        (byGw[r.gw] ||= []).push(r);
      });

      // N for "Top N Avg" — same formula as the live pill, based on the
      // overall league's team count (this page isn't mini-league scoped).
      // Stored in TOP_N (not hardcoded) since the team count — and so N —
      // can change season to season.
      TOP_N = totalTeams <= 30 ? Math.min(3, totalTeams) : Math.floor(totalTeams * 0.10);
      document.querySelector('#stats-table th[data-key="topNAvg"]').textContent = `Top ${TOP_N} Avg`;

      ROWS = Object.entries(byGw).map(([gw, rows]) => {
        const pts = rows.map(r => r.anti_gw_pts);
        const best  = Math.min(...pts);
        const worst = Math.max(...pts);
        const avg   = pts.reduce((a, b) => a + b, 0) / pts.length;

        // Same definition as the live "Top N Avg GW Score" pill: the N teams
        // currently leading the table (by running total through this GW),
        // averaged on their score for this GW specifically.
        const withTotal = rows.filter(r => typeof r.anti_total === 'number');
        const gwTopN = withTotal.length <= 30 ? Math.min(3, withTotal.length) : Math.floor(withTotal.length * 0.10);
        const leaders = [...withTotal].sort((a, b) => a.anti_total - b.anti_total).slice(0, gwTopN);
        const topNAvg = leaders.length
          ? leaders.reduce((sum, r) => sum + r.anti_gw_pts, 0) / leaders.length
          : null;

        // Chips played this GW. active_chip is '' (not null) on a non-chip
        // row, so a plain truthy check is safe.
        const chips = { wildcard: 0, freehit: 0, bboost: 0, '3xc': 0 };
        rows.forEach(r => {
          const c = (r.active_chip || '').toLowerCase();
          if (c in chips) chips[c]++;
        });

        const topCapt   = topCaptByGw[gw] || { leaders: [], max: 0 };
        const topVc     = topVcByGw[gw]   || { leaders: [], max: 0 };
        const worstCapt = formatWorstCapt(gw);

        return { gw: Number(gw), teams: rows.length, best, worst, avg, topNAvg,
                 wc: chips.wildcard, fh: chips.freehit,
                 bb: chips.bboost, tc: chips['3xc'],
                 chipsTotal: chips.wildcard + chips.freehit + chips.bboost + chips['3xc'],
                 topCaptLabel: formatPick(topCapt, gw), topCaptCount: topCapt.max,
                 topVcLabel: formatPick(topVc, gw), topVcCount: topVc.max,
                 worstCaptLabel: worstCapt.label, worstCaptPts: worstCapt.pts };
      });
      ROWS.sort((a, b) => a.gw - b.gw);

      // Best/worst GW scores and best chip scores across the whole season,
      // each attributed to the team and GW that achieved it. Lower is
      // "better" — same golf-style convention as the Best/Worst table columns.
      const ptsRows = allRows.filter(r => typeof r.anti_gw_pts === 'number');
      const lowestOf = rows => rows.reduce((m, r) => (!m || r.anti_gw_pts < m.anti_gw_pts) ? r : m, null);
      const highestOf = rows => rows.reduce((m, r) => (!m || r.anti_gw_pts > m.anti_gw_pts) ? r : m, null);
      const bestGwRow  = lowestOf(ptsRows);
      const worstGwRow = highestOf(ptsRows);
      const bestBbRow  = lowestOf(ptsRows.filter(r => (r.active_chip || '').toLowerCase() === 'bboost'));
      const bestFhRow  = lowestOf(ptsRows.filter(r => (r.active_chip || '').toLowerCase() === 'freehit'));

      const chipStatPill = (label, row) => {
        if (!row) return `<div class="chip-stat-pill"><div class="csp-label">${label}</div><div class="csp-score">—</div></div>`;
        const teamName = esc(teamNameById.get(row.team_id) || row.team_id);
        const link = `team_history.html?team_id=${row.team_id}#gw-row-${row.gw}`;
        return `
          <div class="chip-stat-pill">
            <div class="csp-label">${label}</div>
            <div class="csp-score">${row.anti_gw_pts}</div>
            <div class="csp-meta"><a href="${link}">${teamName} (GW${row.gw})</a></div>
          </div>`;
      };

      document.getElementById('chip-stats-bar').innerHTML =
        chipStatPill('Best Bench Boost Score', bestBbRow) +
        chipStatPill('Best Free Hit Score', bestFhRow) +
        chipStatPill('Best GW Score', bestGwRow) +
        chipStatPill('Worst GW Score', worstGwRow);

      document.getElementById('gw-bar').textContent =
        'These stats are for the overall antifpl table.';
      document.getElementById('last-updated').textContent =
        `Updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;

      renderTable();
      document.getElementById('state-msg').style.display = 'none';
      document.getElementById('stats-table').style.display = '';
      if (chartsExpanded && !chartsBuilt) { renderChart(); chartsBuilt = true; }
    } catch (err) {
      console.error('loadData error:', err);
      showError(err.message);
    }
  }

  function renderTable() {
    const rows = [...ROWS].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return sortDir * (av - bv);
    });

    document.querySelectorAll('#stats-table thead th').forEach(th => {
      th.classList.toggle('sorted', th.dataset.key === sortKey);
    });

    document.getElementById('tbody').innerHTML = rows.map(r => `
      <tr>
        <td class="gw-cell">GW${r.gw}</td>
        <td class="r">${r.teams}</td>
        <td class="r">${r.best}</td>
        <td class="r">${r.worst}</td>
        <td class="r">${r.avg.toFixed(1)}</td>
        <td class="r">${r.topNAvg != null ? r.topNAvg.toFixed(1) : '—'}</td>
        <td class="r chip-cell wc">${r.wc || '—'}</td>
        <td class="r chip-cell fh">${r.fh || '—'}</td>
        <td class="r chip-cell bb">${r.bb || '—'}</td>
        <td class="r chip-cell tc">${r.tc || '—'}</td>
        <td>${r.topCaptLabel}</td>
        <td>${r.topVcLabel}</td>
        <td>${r.worstCaptLabel}</td>
      </tr>
    `).join('');
  }

  document.querySelectorAll('#stats-table thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = key === 'gw' ? 1 : -1; }
      renderTable();
    });
  });

  // Charts are collapsed by default and only built the first time they're
  // expanded — Chart.js sizes itself off the canvas's rendered dimensions,
  // which are meaningless while the container is display:none.
  let CHART_OBJ = null;
  let CHIPS_CHART_OBJ = null;
  let chartsExpanded = false;
  let chartsBuilt = false;
  document.getElementById('charts-toggle').addEventListener('click', () => {
    const body = document.getElementById('charts-body');
    const label = document.getElementById('charts-toggle-label');
    chartsExpanded = body.style.display === 'none';
    body.style.display = chartsExpanded ? '' : 'none';
    label.innerHTML = chartsExpanded ? 'Hide &#x25B4;' : 'Show &#x25BE;';
    if (chartsExpanded && !chartsBuilt && ROWS.length) {
      renderChart();
      renderChipsChart();
      chartsBuilt = true;
    }
  });

  function renderChart() {
    if (CHART_OBJ) { CHART_OBJ.destroy(); CHART_OBJ = null; }
    const labels = ROWS.map(r => `GW${r.gw}`);
    const series = [
      { label: 'Best',      data: ROWS.map(r => r.best),      color: '#1a7f4b' },
      { label: 'Worst',     data: ROWS.map(r => r.worst),     color: '#d62828' },
      { label: 'Average',   data: ROWS.map(r => Number(r.avg.toFixed(1))), color: '#b86e00' },
      { label: `Top ${TOP_N} Avg`, data: ROWS.map(r => r.topNAvg != null ? Number(r.topNAvg.toFixed(1)) : null), color: '#2563eb' },
    ];

    const ctx = document.getElementById('stats-chart').getContext('2d');
    CHART_OBJ = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: series.map(s => ({
          label: s.label,
          data: s.data,
          borderColor: s.color,
          backgroundColor: s.color,
          tension: 0.3,
          spanGaps: true,
          pointRadius: 2,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(0,0,0,.06)' }, ticks: { color: '#888', font: { size: 9 } } },
          y: { grid: { color: 'rgba(0,0,0,.06)' }, ticks: { color: '#888', font: { size: 9 } } },
        },
      },
    });

    document.getElementById('chart-legend').innerHTML = series.map(s => `
      <span><span class="dot" style="background:${s.color}"></span>${s.label}</span>
    `).join('');
  }


  // Chips played per gameweek — grouped (side-by-side) bars, GW on the x-axis.
  // Pure client-side fold over data the page already has; no extra query.
  const CHIP_SERIES = [
    { key: 'wc', label: 'Wildcard',     color: '#7c3aed' },
    { key: 'fh', label: 'Free Hit',     color: '#b86e00' },
    { key: 'bb', label: 'Bench Boost',  color: '#0891b2' },
    { key: 'tc', label: 'Triple Cap',   color: '#d62828' },
  ];

  function renderChipsChart() {
    if (CHIPS_CHART_OBJ) { CHIPS_CHART_OBJ.destroy(); CHIPS_CHART_OBJ = null; }
    const ctx = document.getElementById('chips-chart').getContext('2d');
    CHIPS_CHART_OBJ = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ROWS.map(r => `GW${r.gw}`),
        datasets: CHIP_SERIES.map(s => ({
          label: s.label,
          data: ROWS.map(r => r[s.key] || 0),
          backgroundColor: s.color,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#888', font: { size: 9 } } },
          y: { beginAtZero: true,
               grid: { color: 'rgba(0,0,0,.06)' },
               // Chip counts are whole teams — never show 0.5 of a wildcard.
               ticks: { color: '#888', font: { size: 9 }, precision: 0, stepSize: 1 } },
        },
      },
    });

    document.getElementById('chips-legend').innerHTML =
      CHIP_SERIES.map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('') +
      `<span style="margin-left:auto">${ROWS.reduce((a, r) => a + (r.chipsTotal || 0), 0)} chips played this season</span>`;
  }

  loadData();
</script>
</body>
</html>
